<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do List Life Dashboard</title>
    <link rel="stylesheet" href="css/style.css" />
    <script defer src="js/app.js"></script>
  </head>
  <body>
    <header class="site-header">
      <h1 class="site-title">Life Dashboard</h1>
      <button id="theme-btn" aria-label="Toggle theme">🌙</button>
    </header>
    <section id="greeting" class="widget">
      <h2 id="greeting-text"></h2>
      <p id="datetime"></p>
      <input id="name-input" type="text" style="display: none" />
    </section>
    <section id="timer" class="widget">
      <div class="timer-ring-container">
        <svg viewBox="0 0 120 120" width="120" height="120">
          <circle cx="60" cy="60" r="52" fill="none" stroke="#e0e0e0" stroke-width="8" />
          <circle id="timer-ring" cx="60" cy="60" r="52" fill="none" stroke="currentColor" stroke-width="8" stroke-dasharray="326.7" stroke-dashoffset="0" stroke-linecap="round" transform="rotate(-90 60 60)" />
        </svg>
        <span id="timer-display">25:00</span>
      </div>
      <div class="timer-controls">
        <button id="timer-start">▶ Start</button>
        <button id="timer-stop">⏸ Stop</button>
        <button id="timer-reset">↺ Reset</button>
      </div>
    </section>
    <section id="todos" class="widget">
      <div class="widget-header">
        <h2>To-Do List</h2>
        <span id="todo-count"></span>
      </div>
      <div class="todo-add-row">
        <input id="todo-input" type="text" placeholder="Add a task…" />
        <button id="todo-add">Add</button>
      </div>
      <select id="todo-sort">
        <option value="default">Default</option>
        <option value="alpha">A–Z</option>
        <option value="done-last">Done last</option>
      </select>
      <ul id="todo-list"></ul>
    </section>
    <section id="links"></section>
    <section id="theme-toggle-container"></section>
  </body>
</html>
